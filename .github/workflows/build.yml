
name: Build debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -name '*Fixed*.zip' -o -name '*Android-Source*.zip' \) | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 Android 项目 ZIP 文件"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ZIP 中没有找到完整 Android 项目"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThreePlatformCheckin-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
